<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo DMG Game Boy</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #101014; color: #9aa; font: 12px/1.4 monospace; }
  body { box-sizing: border-box; min-height: 100vh; padding: 16px 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  canvas { width: min(80vw, 640px); height: auto; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #info { min-height: 1.4em; max-width: 90vw; text-align: center; }
  #help { opacity: .7; text-align: center; max-width: 90vw; }
</style>
</head>
<body>
<canvas id="screen"></canvas>
<div id="info"></div>
<div id="help">J1: WASD + F (disparo) &nbsp;|&nbsp; J2: flechas + "," (disparo; entra al pulsar) &nbsp;|&nbsp; P pausa · Enter reinicia</div>

<script src="engine/gbc.js"></script>
<script src="engine/input.js"></script>
<script src="js/loader_dmg.js"></script>
<script src="js/game.js"></script>
</body>
</html>
